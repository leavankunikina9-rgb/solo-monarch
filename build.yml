name: Build Solo Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild project files from bundle.txt
        run: |
          python3 - <<'PY'
          import re, os
          t = open('bundle.txt', encoding='utf-8').read()
          for m in re.finditer(r'^=====FILE: (\S+)\n(.*?)(?=^=====FILE: |\Z)', t, re.S | re.M):
              p = m.group(1)
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              open(p, 'w', encoding='utf-8').write(m.group(2))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solo-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
